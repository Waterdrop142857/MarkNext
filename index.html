<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/startup.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: var(--app-bg, var(--startup-bg, #f5f5f5)); }
      #startup { position: fixed; inset: 0; width: var(--app-viewport-width, 100vw); height: var(--app-viewport-height, 100vh); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: var(--app-bg, var(--startup-bg, #f5f5f5)); color: var(--editor-color, var(--startup-fg, #1f1f1f)); font: 14px/1.5 system-ui, sans-serif; }
      #startup img { width: 64px; height: 64px; }
      #startup-retry { padding: 8px 20px; border: 1px solid currentColor; border-radius: 4px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/icons/marknext.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkNext</title>
  </head>

  <body>
    <div id="startup" role="status" aria-live="polite">
      <img src="/icons/marknext.svg" width="64" height="64" alt="" />
      <span id="startup-message">MarkNext</span>
      <button id="startup-retry" type="button" hidden>Reload</button>
    </div>
    <script>window.__MARKNEXT_STARTUP__?.start();</script>
    <div id="app"></div>
    <script id="application-entry" type="module" src="/src/main.ts"></script>
  </body>
</html>
