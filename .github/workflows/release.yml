name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag or version number, for example v0.1.0, 0.1.0 or v0.2.0-beta.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve and verify release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request

          raw = os.environ['RELEASE_TAG'].strip()
          tag = raw if raw.startswith('v') else f'v{raw}'
          number = r'(0|[1-9][0-9]*)'
          match = re.fullmatch(rf'v{number}\.{number}\.{number}(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?', tag)
          if not match:
              raise SystemExit('Use a version such as 0.1.0, v0.1.0 or v0.2.0-beta.1.')
          prerelease = match.group(4)
          if prerelease and any(part.isdigit() and len(part) > 1 and part.startswith('0') for part in prerelease.split('.')):
              raise SystemExit('Numeric prerelease identifiers cannot have leading zeroes.')
          api = os.environ['GITHUB_API_URL']
          repository = os.environ['GITHUB_REPOSITORY']
          request = urllib.request.Request(f'{api}/repos/{repository}/git/ref/tags/{tag}', headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'User-Agent': 'MarkNext-release',
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  reference = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print(f'::error::Version tag {tag} does not exist in {repository}. Create and push this tag before starting the release workflow.')
                  raise SystemExit(1)
              raise
          if not isinstance(reference, dict) or reference.get('ref') != f'refs/tags/{tag}':
              raise SystemExit('GitHub did not return the exact requested version tag.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - name: Validate tag and application versions
        id: version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tomllib
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          version = tag[1:]
          prerelease = '-' in version
          cargo = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']
          versions = {
              'package.json': json.loads(Path('package.json').read_text())['version'],
              'src-tauri/tauri.conf.json': json.loads(Path('src-tauri/tauri.conf.json').read_text())['version'],
              'src-tauri/Cargo.toml': cargo['version'],
              'src-tauri/Cargo.lock': next(package['version'] for package in tomllib.loads(Path('src-tauri/Cargo.lock').read_text())['package'] if package['name'] == cargo['name'] and 'source' not in package),
          }
          if any(value != version for value in versions.values()):
              raise SystemExit(f'Tag {tag} does not match application versions: {versions}')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\ncommit={commit}\nprerelease={str(bool(prerelease)).lower()}\n')
          PY

  build:
    needs: prepare
    uses: ./.github/workflows/build-installers.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}
      artifact-prefix: installers
      retention-days: 7

  publish:
    # No release is made public until every platform has built successfully.
    needs: [prepare, build]
    concurrency:
      # Manual inputs "0.1.0" and "v0.1.0" resolve to the same release.
      group: release-publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Verify installers and generate checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from collections import Counter
          from pathlib import Path
          files = sorted(Path('release-assets').iterdir())
          expected = Counter({'.deb': 1, '.AppImage': 1, '.exe': 1, '.msi': 1, '.dmg': 2})
          if Counter(file.suffix for file in files if file.is_file() and file.stat().st_size > 0) != expected or len(files) != 6:
              raise SystemExit('Incomplete or unexpected installer set; release will not be published.')
          with open('release-assets/SHA256SUMS.txt', 'w') as output:
              for file in files:
                  with file.open('rb') as content:
                      digest = hashlib.file_digest(content, 'sha256').hexdigest()
                  output.write(f'{digest}  {file.name}\n')
          PY
      - name: Upload installers and publish release
        shell: bash
        run: |
          set -euo pipefail
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"; then
            if [[ "$draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; its assets will not be replaced."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "MarkNext $RELEASE_TAG" --prerelease="$PRERELEASE"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --verify-tag
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --verify-tag
          fi
